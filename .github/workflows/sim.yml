name: sim
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator g++ make
      - name: Golden model + RTL regression
        run: |
          bash ./sim/run_all.sh 2>&1 | tee sim.log
          test "$(grep -c -- '-> PASS' sim.log)" -eq 4
          ! grep -q -- '-> FAIL' sim.log
